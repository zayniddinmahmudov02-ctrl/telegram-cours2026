<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax meet">
  <!-- Original simplified silhouette inspired by the Brandenburg Gate's
       colonnade + quadriga profile, drawn as flat geometric shapes for
       use as a very subtle certificate watermark. -->
  <g fill="#0B1F3A">
    <!-- distant skyline, left -->
    <rect x="40"  y="260" width="18" height="140"/>
    <rect x="70"  y="230" width="14" height="170"/>
    <rect x="96"  y="280" width="22" height="120"/>
    <polygon points="130,400 130,300 145,270 160,300 160,400"/>
    <rect x="185" y="255" width="16" height="145"/>

    <!-- Brandenburg Gate, centered -->
    <g transform="translate(430,110)">
      <!-- base platform -->
      <rect x="-10" y="270" width="360" height="20"/>
      <!-- attic / entablature -->
      <rect x="0" y="60" width="340" height="24"/>
      <!-- pediment -->
      <polygon points="0,60 170,10 340,60"/>
      <!-- six doric columns -->
      <rect x="10"  y="84" width="20" height="186"/>
      <rect x="70"  y="84" width="20" height="186"/>
      <rect x="130" y="84" width="20" height="186"/>
      <rect x="190" y="84" width="20" height="186"/>
      <rect x="250" y="84" width="20" height="186"/>
      <rect x="310" y="84" width="20" height="186"/>
      <!-- quadriga silhouette on top -->
      <g transform="translate(170,-6)">
        <rect x="-3" y="16" width="6" height="18"/>
        <path d="M -34 34 Q -20 4 0 8 Q 20 4 34 34 Z"/>
        <path d="M -34 34 L -46 20 M -18 14 L -26 -2 M 0 8 L 0 -10 M 18 14 L 26 -2 M 34 34 L 46 20"
              stroke="#0B1F3A" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- distant skyline, right -->
    <rect x="900" y="270" width="16" height="130"/>
    <polygon points="935,400 935,290 952,255 969,290 969,400"/>
    <rect x="1000" y="240" width="14" height="160"/>
    <rect x="1030" y="285" width="20" height="115"/>
    <rect x="1080" y="250" width="18" height="150"/>
    <rect x="1120" y="290" width="14" height="110"/>
  </g>
</svg>
