<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sealBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E8ECEF"/>
      <stop offset="62%" stop-color="#AEB7C0"/>
      <stop offset="85%" stop-color="#7A8390"/>
      <stop offset="100%" stop-color="#4E5560"/>
    </radialGradient>
    <radialGradient id="sealRim" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#F7F9FA"/>
      <stop offset="100%" stop-color="#3B414A"/>
    </radialGradient>
    <linearGradient id="emblemShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#3A4048"/>
      <stop offset="45%" stop-color="#22262B"/>
      <stop offset="100%" stop-color="#15171A"/>
    </linearGradient>
  </defs>

  <!-- outer bevel rim (dark, gives depth/thickness) -->
  <circle cx="100" cy="100" r="98" fill="url(#sealRim)"/>
  <!-- raised face -->
  <circle cx="100" cy="100" r="90" fill="url(#sealBody)"/>
  <!-- inner recessed groove -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#3B414A" stroke-width="1.4" opacity="0.6"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F7F9FA" stroke-width="1.2" opacity="0.75"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#4E5560" stroke-width="1"/>

  <!-- fine radial engine-turned texture lines, very subtle -->
  <g stroke="#7A8390" stroke-width="0.35" opacity="0.35">
    <circle cx="100" cy="100" r="84"/>
    <circle cx="100" cy="100" r="76"/>
  </g>

  <!-- laurel wreath, embossed (dark base + light highlight edge) -->
  <g transform="translate(100,100)">
    <g fill="url(#emblemShine)">
      <g transform="rotate(-26) translate(-58,0)"><ellipse rx="7" ry="3.2"/></g>
      <g transform="rotate(-13) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(0) translate(-68,0)"><ellipse rx="8" ry="3.6"/></g>
      <g transform="rotate(13) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(26) translate(-58,0)"><ellipse rx="7" ry="3.2"/></g>

      <g transform="rotate(154) translate(-58,0)"><ellipse rx="7" ry="3.2"/></g>
      <g transform="rotate(167) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(180) translate(-68,0)"><ellipse rx="8" ry="3.6"/></g>
      <g transform="rotate(193) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(206) translate(-58,0)"><ellipse rx="7" ry="3.2"/></g>
    </g>
    <!-- thin highlight along the upper-left edge of each leaf cluster -->
    <g fill="none" stroke="#F7F9FA" stroke-width="0.6" opacity="0.55">
      <g transform="rotate(-13) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(0) translate(-68,0)"><ellipse rx="8" ry="3.6"/></g>
      <g transform="rotate(167) translate(-64,0)"><ellipse rx="7.5" ry="3.4"/></g>
      <g transform="rotate(180) translate(-68,0)"><ellipse rx="8" ry="3.6"/></g>
    </g>
  </g>

  <!-- star emblem, center - embossed with dark base + light bevel -->
  <g transform="translate(100,100)">
    <polygon points="0,-26 6.4,-8 25,-8 10,3.6 15.6,21 0,10 -15.6,21 -10,3.6 -25,-8 -6.4,-8"
             fill="url(#emblemShine)"/>
    <polygon points="0,-26 6.4,-8 25,-8 10,3.6 15.6,21 0,10 -15.6,21 -10,3.6 -25,-8 -6.4,-8"
             fill="none" stroke="#F7F9FA" stroke-width="0.7" opacity="0.6"/>
  </g>
</svg>
